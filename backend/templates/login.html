<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Your little site</title><link rel="stylesheet" href="{{prefix}}/static/editor.css"></head><body><main class="login"><h1>Your little site</h1><p>Sign in to edit your words, photos and surprises.</p>{% if error %}<p class="error" role="alert">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Username<input name="username" autocomplete="username" required placeholder="zavvrel or l3gh" maxlength="40"></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button>Sign in</button></form><p class="small">Only the two site editors can sign in. This password is separate from your GitHub password.</p></main></body></html>
